# Feature List                            Edit, add or remove features to be presented.
features                                  :

  - title                                 : Live Dashboard
    description                           : Battery level, range, charging status and vehicle state updated in real time, always at a glance.
    fontawesome_icon_name                 : tachometer-alt

  - title                                 : Remote Control
    description                           : Start or stop charging, pre-condition the cabin, trigger the horn or flash the lights — all from your iPhone or iPad.
    fontawesome_icon_name                 : satellite-dish

  - title                                 : Charge History
    description                           : Every charging session logged automatically. Review duration, energy added and location with a single tap.
    fontawesome_icon_name                 : history

  - title                                 : Electricity Tariffs
    description                           : Define your tariff periods and assign them to each session. Maxwell calculates the real cost of every charge.
    fontawesome_icon_name                 : bolt

  - title                                 : Statistics
    description                           : Monthly and yearly charts of energy consumption and charging costs, built with Swift Charts for a native feel.
    fontawesome_icon_name                 : chart-bar

  - title                                 : Home Assistant Native
    description                           : Connects directly to your local PSA Car Controller instance. No cloud, no third-party accounts, full privacy.
    fontawesome_icon_name                 : home


